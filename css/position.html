<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.relative {
            position: relative;
            left: 30px;
            width: 400px;
            height: 200px;
            border: 3px solid green;
        }

        div.absolute {
            position: absolute;
            top: 50px;
            right: 70px;
            width: 200px;
            height: 100px;
            border: 3px solid red;
        }
    </style>
</head>


<h1>CSS position Absolute</h2>

<p>An element with position: absolute; is positioned relative to the nearest positioned ancestor:</p>

<div class="relative">position: relative (parent);
  <div class="absolute"> position: absolute(child);</div>
</div>
