<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 200px;
            width: 200px;
            background: red;
            position: relative;
            animation: mymove  10s infinite;
            margin: 200px;
        }
        .circle{
            background: red;
            border-radius: 50%;
            height: 200px;
            width: 200px;
            position: relative;
            animation: circle 10s infinite;
            margin: 0px;

        }

        @keyframes mymove {
            0% {
                top: 0px;
                left: 0px;
                background: red;
            }

            25% {
                top: 0px;
                left: -100px;
                background: blue;
            }

            50% {
                top: -100px;
                left: -100px;
                background: green;
            }

            75% {
                top: -100px;
                left: 0px;
                background: yellow;
            }
            100%{
                top: 0px;
                left: 0px;
                background: red; }
        }

        @keyframes circle {
              0% {
                top: 0px;
                left: 0px;
                background: red;
            }

            25% {
                top: 0px;
                left: 100px;
                background: blue;
            }

            50% {
                top: 100px;
                left: 100px;
                background: green;
            }

            75% {
                top: 100px;
                left: 0px;
                background: yellow;
            }
            100%{
                top: 0px;
                left: 0px;
                background: red; }

            
        }
    </style>
</head>

<body>
    <h1> Key Frames </h1>
    <div>  </div>
    <br>
    <div class="circle"> </div>
    <br>
    
</body>

</html>
