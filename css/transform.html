<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heading,
        .head1,
        .head2,
        .head3 {
            border: 5px solid grey;
            border-width: 5px;
            width: 330px;
            height: 300px;
            text-align: center;
            background-color: aqua;
            padding-top: 200px;
            margin-top: 180px;
            margin-left: 100px;
            text-shadow: black;
            transition-delay: 1s;
            transition-duration: 2s;

        }

        .heading:hover {
            transform: skew(50deg);

        }

        .head1:hover {
            transform: rotate(360deg);
        }

        .head2:hover {
            transform: scale(3, 3);
        }

        .head3:hover {
            transform: translate(100px, -100px);
        }
    </style>
</head>

<body>
    <h1 class="heading"> skew </h1>
    <h2 class="head1"> rotate</h2>
    <h3 class="head2"> scale</h3>
    <h4 class="head3"> translate</h4>

</body>
</html>
