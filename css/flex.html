<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-flow: row;
            justify-content: space-around;
            align-items: center;
            height: 200px;
            background-color: #f0f0f0;
        }

        .item {
            background: #4CAF50;
            color: white;
            padding: 20px;
            font-size: 20px;
            flex: 1;
            margin: 5px;
            text-align: center;
            flex-shrink: 1;
        }

        .container2 {
            display: flex;
            flex-flow: row wrap-reverse;
            align-items: center;
            height: 220px;
            background-color: rgb(215, 230, 225);
            justify-content: space-around;
            padding: 15px;
        }

        .container4 {
            display: flex;
            flex-flow: row-reverse wrap;
            width: 500px;
        }
        .item1{
            order: 2;
             background: #4CAF50;
            color: white;
            padding: 20px;
            font-size: 20px;
            margin: 5px;
            text-align: center;
            flex-shrink: 4;
        }
        .item2{
            order: 1;
             background: #4CAF50;
            color: white;
            padding: 20px;
            font-size: 20px;
            flex-grow: 4;
            margin: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">item 1</div>
        <div class="item1">item 2</div>
        <div class="item2">item 3</div>

    </div>

    <br>

    <div class="container2">
        <div class="container">
            <div class="item">item 1</div>
            <div class="item">item 2</div>
            <div class="item">item 3</div>
        </div>
        <div class="container">
            <div class="item"> item 4</div>
            <div class="item"> item 5</div>
            <div class="item"> item 6</div>
        </div>
        <div class="container">
            <div class="item">item 7</div>
            <div class="item">item 8</div>
            <div class="item">item 9</div>
        </div>
    </div>
    <br>

    <div class="container4">
        <div class="item">item 1</div>
        <div class="item">item 2</div>
        <div class="item">item 3</div>
        <div class="item">item 1</div>
        <div class="item">item 2</div>
        <div class="item">item 3</div>
    </div>
</body>

</html>
